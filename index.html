<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="icon" href="tic-tac-toe.ico" sizes="any">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="game" aria-label="Machine learning tic-tac-toe game">
      <header>
        <img class="logo" src="estime_logo_RGB.png" alt="Estime">
        <div class="title-row" id="titleRow">
          <img class="ai-watch-icon" src="ia-watching-eye.svg" alt="" aria-hidden="true">
          <h1>Tic-Tac-Toe</h1>
          <img class="ai-watch-icon" src="ia-watching-eye.svg" alt="" aria-hidden="true">
        </div>
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="status-message" id="statusMessage">X commence</span>
          <button
            class="status-inspect"
            id="inspectRecordedMoves"
            type="button"
            aria-label="Voir les coups enregistrés"
            title="Voir les coups enregistrés"
            hidden
          >&#128065;</button>
        </div>
      </header>

      <div class="board" id="board" aria-label="Tic-tac-toe board">
        <button class="cell" type="button" aria-label="Empty cell 1"></button>
        <button class="cell" type="button" aria-label="Empty cell 2"></button>
        <button class="cell" type="button" aria-label="Empty cell 3"></button>
        <button class="cell" type="button" aria-label="Empty cell 4"></button>
        <button class="cell" type="button" aria-label="Empty cell 5"></button>
        <button class="cell" type="button" aria-label="Empty cell 6"></button>
        <button class="cell" type="button" aria-label="Empty cell 7"></button>
        <button class="cell" type="button" aria-label="Empty cell 8"></button>
        <button class="cell" type="button" aria-label="Empty cell 9"></button>
      </div>

      <div class="actions">
        <button class="reset" id="reset" type="button">Recommencer la partie</button>
      </div>

      <div class="mode-control">
        <label for="mode">Mode</label>
        <select id="mode" name="mode">
          <option value="manual">Standard</option>
          <option value="ai-training">Entraînement d'IA</option>
          <option value="vs-ai">Jouer contre l'IA</option>
        </select>
      </div>

      <section class="mode-panel" id="trainingPanel" aria-label="Contrôles d'entraînement" hidden>
        <div class="panel-stat recorded-info">
          <span class="panel-label">Informations enregistrées</span>
          <div class="recorded-stats">
            <div class="recorded-stat">
              <span>Nombre de parties</span>
              <strong id="savedGamesCount">0</strong>
            </div>
            <div class="recorded-stat">
              <span>Nombre de coups</span>
              <strong id="savedMovesCount">0</strong>
            </div>
          </div>
        </div>
        <div class="panel-actions">
          <button class="panel-button primary" id="trainModel" type="button">Entraîner le modèle</button>
          <button class="panel-button" id="clearTrainingData" type="button">Effacer les données</button>
        </div>
      </section>

      <section class="mode-panel" id="aiPanel" aria-label="Information sur l'IA" hidden>
        <div class="panel-stat">
          <span class="panel-label">Score de confiance du dernier tour</span>
          <strong id="confidenceScore">--</strong>
        </div>
        <div class="confidence-chart" aria-label="Historique des scores de confiance de l'IA">
          <svg id="confidenceChart" viewBox="0 0 260 112" role="img" aria-labelledby="confidenceChartTitle">
            <title id="confidenceChartTitle">Scores de confiance des coups joués par l'IA</title>
            <line class="chart-axis" x1="28" y1="8" x2="28" y2="88"></line>
            <line class="chart-axis" x1="28" y1="88" x2="248" y2="88"></line>
            <text class="chart-label" x="5" y="13">100%</text>
            <text class="chart-label" x="10" y="92">0%</text>
            <text class="chart-move-label" x="42" y="104">1</text>
            <text class="chart-move-label" x="90" y="104">2</text>
            <text class="chart-move-label" x="138" y="104">3</text>
            <text class="chart-move-label" x="186" y="104">4</text>
            <text class="chart-move-label" x="234" y="104">5</text>
            <polyline class="chart-line" id="confidenceLine" points=""></polyline>
            <g id="confidenceDots"></g>
          </svg>
        </div>
      </section>
    </section>
  </main>

  <dialog class="recorded-moves-dialog" id="recordedMovesDialog" aria-labelledby="recordedMovesTitle">
    <div class="dialog-header">
      <h2 id="recordedMovesTitle">Coups enregistrés</h2>
      <button
        class="dialog-close"
        id="closeRecordedMoves"
        type="button"
        aria-label="Fermer"
        title="Fermer"
      >&times;</button>
    </div>
    <div class="recorded-moves-list" id="recordedMovesList"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
